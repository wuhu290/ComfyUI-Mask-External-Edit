[project]
name = "kusart-mask-external-edit"
version = "0.1.0"
description = "Masked local edit node for ComfyUI. Crop a user-painted region, send it to an external image editing API, and blend it back into the original image."
license = { file = "LICENSE" }
requires-python = ">=3.10"
dynamic = ["dependencies"]
classifiers = [
    "Operating System :: OS Independent",
]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[project.urls]
Repository = "https://github.com/YOUR_NAME/ComfyUI-KusArt-Mask-External-Edit"
Documentation = "https://github.com/YOUR_NAME/ComfyUI-KusArt-Mask-External-Edit#readme"
"Bug Tracker" = "https://github.com/YOUR_NAME/ComfyUI-KusArt-Mask-External-Edit/issues"

[tool.comfy]
PublisherId = "YOUR_PUBLISHER_ID"
DisplayName = "KusArt Mask External Edit"
